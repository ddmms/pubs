name: Deploy Publications to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run every Monday at 05:00 UTC to sync with ORCID API
    - cron: "0 5 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fetch publications from ORCID and generate site
        run: |
          python pubs.py

      - name: Run test suite
        run: |
          python -m unittest test_pubs.py

      - name: Commit updated publications data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update publications from ORCID [skip ci]"
          file_pattern: "PUBLICATIONS.md index.html publications.json data/cache/*.json"
        continue-on-error: true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

